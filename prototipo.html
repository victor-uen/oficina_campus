/** Data, local e instrutores de uma oficina, em uma linha. */
function courseMeta(o){const d=o.dados;const local=d.modalidade==='Online'||!d.espaco?'Online':refTitle('espacos',d.espaco);const who=[].concat(d.instrutores||[]).map(id=>refTitle('instrutores',id));return `<div class="coursemeta">${d.data?`<span>${icon('clock')}${esc(fmtDate(d.data))}</span>`:''}<span>${icon('pin')}${esc(local)}</span>${who.length?`<span>${icon('users')}${esc(who.join(', '))}</span>`:''}</div>`;}
function statusPills(o){return `${o.estado==='ARQUIVADO'?badge(o):''}${isRealized(o)?'<span class="pill gray">Realizada</span>':''}${state.profile!=='comunidade'&&C.overCapacity(o,records)?`<span class="pill warn" title="A capacidade do espaço foi reduzida depois do cadastro.">${icon('alert')}Limite acima da capacidade do espaço</span>`:''}`;}
function seatsLine(o){if(!mod('participantes'))return `<span>${icon('users')}Até ${esc(o.dados.limite)} participantes</span>`;const n=occupiedOf(o.id),l=o.dados.limite;return `<span class="seats ${n>=l?'full':''}">${icon('users')}${n>=l?'Vagas esgotadas':`${l-n} ${l-n===1?'vaga restante':'vagas restantes'}`} · ${n} de ${l}</span>`;}
function card(o,index){const past=isRealized(o);return `<article class="card ${past||o.estado==='ARQUIVADO'?'past':''}"><div class="card-art theme-${index%3}"><div class="arttags">${statusPills(o)||badge(o)}</div>${icon(['code','grid','spark'][index%3])}</div><div class="cardbody"><h3>${esc(o.dados.titulo)}</h3>${courseMeta(o)}<div class="coursemeta">${seatsLine(o)}</div><p>${esc(o.dados.apresentacao)}</p><div class="cardfoot"><span>${icon('clock')} ${esc(o.dados.duracao)} min · ${esc(o.dados.modalidade)}</span><button data-action="openoficina" data-id="${o.id}">Abrir oficina →</button></div></div></article>`;}
const byDate=(a,b)=>String(a.dados.data||'').localeCompare(String(b.dados.data||''));
const upcoming=()=>(records.oficinas||[]).filter(o=>o.estado==='ATIVO'&&!isRealized(o)).sort(byDate);

/* ---------- Marina: visão geral ---------- */

/* ---------- Calendário ---------- */
function defaultMonth(){const n=upcoming()[0];return (n?n.dados.data:agora()).slice(0,7);}
function monthGrid(month,compact){
 const [y,mo]=month.split('-').map(Number),first=new Date(Date.UTC(y,mo-1,1)),days=new Date(Date.UTC(y,mo,0)).getUTCDate(),start=first.getUTCDay();
 const list=(records.oficinas||[]).filter(o=>o.estado==='ATIVO'&&o.dados.data?.startsWith(month)).sort(byDate),today=agora().slice(0,10);
 const cells=[];for(let i=0;i<start;i++)cells.push('<div class="calday empty" aria-hidden="true"></div>');
 for(let d=1;d<=days;d++){const day=`${month}-${pad(d)}`,evs=list.filter(o=>o.dados.data.startsWith(day));
  cells.push(compact?`<div class="calday ${day===today?'today':''} ${evs.length?'has':''}">${evs.length?`<button data-action="openoficina" data-id="${evs[0].id}" aria-label="${esc(fmtDay(day))}: ${esc(evs.map(o=>o.dados.titulo).join(', '))}" class="${evs.every(isRealized)?'past':''}">${d}</button>`:`<span>${d}</span>`}</div>`
  :`<div class="calday ${day===today?'today':''}"><div class="calnum"><span>${d}</span>${state.profile==='organizacao'?`<button class="caladd" data-action="createday" data-day="${day}" aria-label="Nova oficina em ${esc(fmtDay(day))}">${icon('plus')}</button>`:''}</div>${evs.map(o=>`<button class="calevent ${isRealized(o)?'past':''} ${C.overCapacity(o,records)?'warn':''}" data-action="openoficina" data-id="${o.id}" title="${esc(o.dados.titulo)} · ${esc(o.dados.data.slice(11))}–${esc(endTime(o))}"><b>${esc(o.dados.data.slice(11))}</b> ${esc(o.dados.titulo)}<small>${esc(o.dados.modalidade==='Online'||!o.dados.espaco?'Online':refTitle('espacos',o.dados.espaco))} · ${esc([].concat(o.dados.instrutores||[]).map(i=>refTitle('instrutores',i)).join(', '))}</small></button>`).join('')}</div>`);}
 return {html:`<div class="calendar ${compact?'mini':''}" role="grid" aria-label="Calendário de ${MONTHS[mo-1]} de ${y}">${WEEK.map(w=>`<div class="calweek" role="columnheader">${compact?w[0]:w}</div>`).join('')}${cells.join('')}</div>`,list,label:`${MONTHS[mo-1][0].toUpperCase()+MONTHS[mo-1].slice(1)} de ${y}`};
}
function shiftMonth(month,delta){let [y,mo]=month.split('-').map(Number);mo+=delta;while(mo<1){mo+=12;y--;}while(mo>12){mo-=12;y++;}return `${y}-${pad(mo)}`;}
function renderCalendar(){
 const month=state.month||defaultMonth(),g=monthGrid(month,false);
 $('#conteudo').innerHTML=`<div class="pageheading"><div><div class="eyebrow muted" style="margin-bottom:10px">Agenda das oficinas</div><h1>Calendário</h1><p>Data, horário, local e instrutores de cada oficina. Clique em uma oficina para abrir a página dela.</p></div>${state.profile==='organizacao'?`<button class="button" data-action="create" data-module="oficinas">${icon('plus')}Nova oficina</button>`:''}</div><div class="alertline">${icon('alert')}<span>O sistema recusa oficinas que usem o mesmo espaço, o mesmo instrutor ou o mesmo equipamento em horários sobrepostos.</span></div><div class="calhead"><button class="iconbutton" data-action="month" data-delta="-1" aria-label="Mês anterior">${icon('chevl')}</button><h2>${g.label}</h2><button class="iconbutton" data-action="month" data-delta="1" aria-label="Próximo mês">${icon('chevr')}</button><button class="outline" data-action="month" data-delta="0">Hoje</button><span class="legend inline"><span class="dot"></span>Agendada<span class="dot past"></span>Realizada</span></div>${g.html}<div class="sectionhead"><h2>Agenda de ${g.label.toLowerCase()}</h2><span class="muted">${g.list.length} ${g.list.length===1?'oficina':'oficinas'}</span></div>${g.list.length?`<ul class="agenda">${g.list.map(o=>`<li class="${isRealized(o)?'past':''}"><button data-action="openoficina" data-id="${o.id}"><time>${esc(fmtDay(o.dados.data))}<small>${esc(o.dados.data.slice(11))}–${esc(endTime(o))}</small></time><span><b>${esc(o.dados.titulo)}</b>${courseMeta(o)}</span>${statusPills(o)}</button></li>`).join('')}</ul>`:'<p class="muted">Nenhuma oficina ativa neste mês.</p>'}${footer()}`;
}

/* ---------- Beatriz: minhas próximas oficinas ---------- */
function checklist(o){
 const has=id=>visibleModules().some(m=>m.id===id),of=id=>(records[id]||[]).filter(r=>r.estado!=='ARQUIVADO'&&belongs(mod(id),r,o.id));
 const items=[
  has('interesses')&&(()=>{const n=of('interesses').filter(r=>r.dados.situacao==='Pendente').length;return [n?'warn':'ok',n?`${n} ${n===1?'interesse pendente':'interesses pendentes'}`:'Nenhum interesse pendente','pessoas'];})(),
  has('participantes')&&[isFull(o)?'ok':'info',`${occupiedOf(o.id)} de ${o.dados.limite} participantes`,'pessoas'],
  has('kits')&&(()=>{const n=of('kits').length;return [n?'ok':'warn',n?'Kit de materiais preparado':'Sem kit de materiais','recursos'];})(),
  has('equipamentos')&&(()=>{const n=of('equipamentos').length;return ['info',n?`${n} ${n===1?'equipamento reservado':'equipamentos reservados'}`:'Nenhum equipamento reservado','recursos'];})(),
  has('acessibilidade')&&(()=>{const n=of('acessibilidade').length;return ['info',n?`${n} ${n===1?'recurso de acessibilidade':'recursos de acessibilidade'}`:'Sem recursos de acessibilidade','recursos'];})(),
  has('tarefas')&&(()=>{const n=of('tarefas').filter(r=>r.dados.situacao!=='Concluída').length;return [n?'warn':'ok',n?`${n} ${n===1?'tarefa aberta':'tarefas abertas'}`:'Tarefas concluídas','execucao'];})(),
  has('ocorrencias')&&(()=>{const n=of('ocorrencias').filter(r=>r.dados.situacao!=='Resolvida').length;return [n?'warn':'ok',n?`${n} ${n===1?'ocorrência aberta':'ocorrências abertas'}`:'Nenhuma ocorrência aberta','execucao'];})()
 ].filter(Boolean);
 return items.length?`<ul class="checklist">${items.map(([s,t,tab])=>`<li class="${s}"><button data-action="openoficina" data-id="${o.id}" data-tab="${tab}">${icon(s==='warn'?'alert':s==='ok'?'check':'eye')}<span>${esc(t)}</span>${icon('chevr')}</button></li>`).join('')}</ul>`:'';
}
function renderSupport(){
 const next=upcoming(),month=state.month||defaultMonth(),g=monthGrid(month,true);
 const extra=[mod('atendimentos')&&[(records.atendimentos||[]).filter(r=>r.estado==='ATIVO').length,'Atendimentos recebidos','atendimentos','mail'],mod('sugestoes')&&[(records.sugestoes||[]).filter(r=>r.estado==='ATIVO').length,'Sugestões da comunidade','sugestoes','spark']].filter(Boolean);
 $('#conteudo').innerHTML=`<div class="pageheading"><div><div class="eyebrow muted" style="margin-bottom:10px">Apoio à organização</div><h1>Olá, Beatriz.</h1><p>Suas próximas oficinas e o que cada uma ainda precisa. Clique em um item para abrir a aba certa da oficina.</p></div></div><div class="supportgrid"><section class="panel"><div class="calhead small"><button class="iconbutton" data-action="month" data-delta="-1" aria-label="Mês anterior">${icon('chevl')}</button><h3>${g.label}</h3><button class="iconbutton" data-action="month" data-delta="1" aria-label="Próximo mês">${icon('chevr')}</button></div>${g.html}<a class="textlink" href="#calendario">Abrir calendário completo →</a>${extra.length?`<div class="miniStats">${extra.map(([n,l,href,i])=>`<a class="quicklink" href="#${href}">${icon(i)}<span><b>${n}</b> ${esc(l)}</span></a>`).join('')}</div>`:''}</section><section><div class="sectionhead"><h2>Minhas próximas oficinas</h2><span class="muted">${next.length} ${next.length===1?'oficina':'oficinas'}</span></div>${next.length?next.map(o=>`<article class="panel upcoming"><div class="upcominghead"><div><h3><button class="textlink strong" data-action="openoficina" data-id="${o.id}">${esc(o.dados.titulo)}</button></h3>${courseMeta(o)}</div>${statusPills(o)}</div>${checklist(o)}</article>`).join(''):'<div class="empty">'+icon('cal')+'<h2>Nenhuma oficina agendada.</h2><p>As próximas oficinas aparecem aqui assim que a organização as cadastra.</p></div>'}</section></div>${footer()}`;
}

/* ---------- Página da oficina ---------- */
function renderOficina(){
 const o=(records.oficinas||[]).find(r=>r.id===state.oficinaId);const m=mod('oficinas');
 if(!o){$('#conteudo').innerHTML=`<div class="empty">${icon('search')}<h2>Oficina não encontrada.</h2><p>Ela pode ter sido removida da demonstração.</p><a class="button" href="#oficinas">Voltar às oficinas</a></div>`;return;}
 const tabs=TABS.filter(([id,,t])=>!t||tabModules(id).length);if(!tabs.some(t=>t[0]===state.tab))state.tab='resumo';
 const d=o.dados,can=canWrite(m),past=isRealized(o);
 $('#conteudo').innerHTML=`<a class="textlink back" href="#${state.profile==='organizacao'?'oficinas':'inicio'}">${icon('back')}${state.profile==='organizacao'?'Oficinas':'Minhas oficinas'}</a><div class="pageheading oficinahead ${past||o.estado==='ARQUIVADO'?'past':''}"><div><div class="eyebrow muted" style="margin-bottom:10px">Oficina · ${esc(d.modalidade)} · ${esc(d.duracao)} min</div><h1>${esc(d.titulo)}</h1>${courseMeta(o)}<div class="coursemeta">${seatsLine(o)}${statusPills(o)}</div></div><div class="headactions">${can?`<button class="outline" data-action="${o.estado==='ARQUIVADO'?'restaurar':'arquivar'}" data-module="oficinas" data-id="${o.id}">${icon(o.estado==='ARQUIVADO'?'restore':'archive')}${o.estado==='ARQUIVADO'?'Restaurar':'Arquivar'}</button>${C.canEdit(m,o)?`<button class="button" data-action="edit" data-module="oficinas" data-id="${o.id}">${icon('edit')}Editar oficina</button>`:''}`:'<span class="badge">Dados da oficina: somente consulta</span>'}</div></div>${o.estado==='ARQUIVADO'?'<div class="alertline">A oficina está arquivada: saiu do portal e do calendário. As fichas ligadas a ela foram preservadas; novas fichas exigem restaurar a oficina.</div>':past?'<div class="alertline">Esta oficina já aconteceu. Ela fica acinzentada até ser arquivada, e o portal passa a aceitar avaliações.</div>':''}<nav class="tabs" role="tablist" aria-label="Seções da oficina">${tabs.map(([id,t])=>`<button role="tab" data-action="tab" data-tab="${id}" class="${state.tab===id?'active':''}" aria-selected="${state.tab===id}">${t}${id!=='resumo'?`<span class="count">${tabModules(id).reduce((n,x)=>n+(records[x.id]||[]).filter(r=>r.estado!=='ARQUIVADO'&&belongs(x,r,o.id)).length,0)}</span>`:''}</button>`).join('')}</nav><div id="tabpanel" role="tabpanel">${state.tab==='resumo'?oficinaSummary(o):tabModules(state.tab).map(x=>tabSection(x,o)).join('')}</div>${footer()}`;
}
function oficinaSummary(o){const d=o.dados,esp=d.espaco?(records.espacos||[]).find(e=>e.id===d.espaco):null;
 return `<div class="twocol"><section class="panel"><h2>Apresentação</h2><p class="note">${esc(d.apresentacao)}</p><dl>${[['Data e horário',`${fmtDate(d.data)} até ${endTime(o)}`],['Local',d.modalidade==='Online'||!esp?'Online':`${esp.dados.nome} · ${esp.dados.localizacao} · capacidade ${esp.dados.capacidade}`],['Instrutores',[].concat(d.instrutores||[]).map(i=>refTitle('instrutores',i)).join(', ')],['Limite de participantes',d.limite]].map(([k,v])=>`<div class="detailitem"><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl></section><section class="panel"><h2>O que está ligado a ela</h2>${TABS.filter(t=>t[2]&&tabModules(t[0]).length).map(([id,t])=>`<button class="summaryrow" data-action="tab" data-tab="${id}"><b>${t}</b><span>${tabModules(id).map(x=>`${(records[x.id]||[]).filter(r=>r.estado!=='ARQUIVADO'&&belongs(x,r,o.id)).length} ${esc(x.title.toLowerCase())}`).join(' · ')}</span>${icon('chevr')}</button>`).join('')||'<p class="muted">As abas de pessoas, recursos, preparação e execução aparecem quando essas partes entram no sistema.</p>'}</section></div>`;}
function rowInfo(m,r){
 if(m.id==='interesses')return `${esc(r.dados.email)} · ${esc(r.dados.telefone)} · ${esc(r.dados.profissao)}`;
 if(m.id==='participantes')return `${esc(r.dados.email)} · ${esc(r.dados.profissao)}`;
 if(m.id==='avaliacoes')return `${'★'.repeat(r.dados.nota)}${'☆'.repeat(5-r.dados.nota)} · ${esc(r.dados.aspecto)}`;
 if(m.id==='leituras')return `${esc(r.dados.autor)} · ${esc(r.dados.tipo)}${r.dados.trecho?' · '+esc(r.dados.trecho):''} · ${esc(r.dados.obrigatoriedade)}`;
 if(m.id==='tarefas'||m.id==='ocorrencias')return esc(r.dados.situacao);
 const f=plainFields(m)[1];const v=f?r.dados[f.key]:'';return esc(Array.isArray(v)?v.join(', '):v??'');
}
function tabSection(m,o){
 const items=(records[m.id]||[]).filter(r=>belongs(m,r,o.id)).sort(m.id==='leituras'?(a,b)=>a.dados.ordem-b.dados.ordem:(a,b)=>b.criadoEm.localeCompare(a.criadoEm));
 const can=canWrite(m),arch=o.estado==='ARQUIVADO',multi=!!multiField(m);
 let add='';
 if(can&&m.create!==false){
  const reason=arch?'Restaure a oficina para adicionar':m.id==='participantes'&&isFull(o)?'Vagas esgotadas':m.id==='avaliacoes'&&!isRealized(o)?'Disponível depois que a oficina acontecer':'';
  const text=multi?(m.id==='equipamentos'?'Reservar equipamento':'Adicionar instituição'):'Adicionar';
  add=reason?`<button class="outline" disabled aria-disabled="true" title="${esc(reason)}">${esc(reason)}</button>`:`<button class="outline" data-action="${multi?'reserve':'createin'}" data-module="${m.id}" data-oficina="${o.id}">${icon('plus')}${text}</button>`;
 }
 const note=m.id==='interesses'?'As manifestações chegam pelo portal da comunidade. Aceitar inclui a pessoa como participante.':m.id==='participantes'?`${occupiedOf(o.id)} de ${o.dados.limite} vagas ocupadas. Arquivar um participante libera a vaga.`:m.id==='equipamentos'?'Equipamentos da instituição reservados para o horário desta oficina.':m.id==='parceiras'?'Instituições que apoiam esta oficina. Uma instituição pode apoiar várias oficinas.':m.policy==='conteudo'?'Publique para aparecer no portal, no cartão da oficina.':'';
 const rows=items.map(r=>`<li class="${r.estado==='ARQUIVADO'?'archivedrow':''}"><button class="rowmain" data-action="detail" data-module="${m.id}" data-id="${r.id}"><b>${esc(label(r))}</b><small>${rowInfo(m,r)}</small></button><span class="rowtags">${m.id==='interesses'?`<span class="pill ${({Pendente:'gold',Aceita:'',Recusada:'gray'})[r.dados.situacao]}">${esc(r.dados.situacao)}</span>`:''}${r.estado!=='ATIVO'?badge(r):''}</span><span class="rowactions">${m.id==='interesses'&&can&&r.estado==='ATIVO'&&r.dados.situacao==='Pendente'?`<button class="button small" data-action="aceitar" data-module="interesses" data-id="${r.id}">${icon('check')}Aceitar</button><button class="outline small" data-action="recusar" data-module="interesses" data-id="${r.id}">${icon('x')}Recusar</button>`:''}${multi&&can&&r.estado==='ATIVO'?`<button class="outline small" data-action="unreserve" data-module="${m.id}" data-id="${r.id}" data-oficina="${o.id}">${m.id==='equipamentos'?'Cancelar reserva':'Remover apoio'}</button>`:''}${!multi&&can&&C.canEdit(m,r)?`<button class="iconbutton" title="Editar" aria-label="Editar ${esc(label(r))}" data-action="edit" data-module="${m.id}" data-id="${r.id}">${icon('edit')}</button>`:''}</span></li>`).join('');
 return `<section class="tabsection" id="sec-${m.id}"><div class="sectionhead"><h2>${icon(icons[m.id])}${esc(m.title)} <span class="muted">${items.filter(r=>r.estado!=='ARQUIVADO').length}</span></h2>${add}</div>${note?`<p class="smallnote">${esc(note)}</p>`:''}${items.length?`<ul class="recordlist">${rows}</ul>`:`<p class="muted emptyline">Nada cadastrado para esta oficina.</p>`}</section>`;
}

/* ---------- Telas do menu ---------- */

Visualização em lista" data-action="view" data-view="list" class="${state.view==='list'?'active':''}">${icon('list')}</button></div>`:''}</div><div id="records"></div>${footer()}`;renderRecords();}
function searchable(m,r){return [...Object.values(r.dados).flat(),...m.fields.filter(f=>f.kind==='ref').flatMap(f=>[].concat(r.dados[f.key]||[]).map(id=>refTitle(f.ref,id)))];}
const refRecord=(target,id)=>(records[target]||[]).find(r=>r.id===id)||(target==='oficinas'?(publicData.oficinas||[]).find(r=>r.id===id):null);
const refTitle=(target,id)=>{const r=refRecord(target,id);return r?label(r):'Registro não encontrado';};
function refChip(target,id){const r=refRecord(target,id);if(!r)return '<span class="muted">Registro não encontrado</span>';const go=target==='oficinas'&&state.profile!=='comunidade';return `<button class="linkchip ${r.estado==='ARQUIVADO'?'archived':''}" data-action="${go?'openoficina':'detail'}" data-module="${target}" data-id="${esc(id)}">${icon(icons[target])}${esc(label(r))}${target==='oficinas'&&r.dados.data?' · '+esc(r.dados.data.slice(0,10).split('-').reverse().join('/')):''}${r.estado==='ARQUIVADO'?' · arquivado':''}</button>`;}
function renderRecords(){const m=mod(state.route);if(!m)return;const cols=plainFields(m).slice(0,2),q=state.query.trim().toLocaleLowerCase('pt-BR'),mf=multiField(m);
 let items=(records[m.id]||[]).filter(r=>(state.filter==='TODOS'||state.filter===r.estado)&&searchable(m,r).some(v=>String(v??'').toLocaleLowerCase('pt-BR').includes(q)));
 items.sort(state.sort==='nome'?(a,b)=>label(a).localeCompare(label(b),'pt-BR'):m.id==='oficinas'?(a,b)=>(isRealized(a)-isRealized(b))||byDate(a,b):(a,b)=>b.criadoEm.localeCompare(a.criadoEm));
 const filtered=state.query||state.filter!=='TODOS',can=canWrite(m)&&m.create!==false;
 $('#records').innerHTML=`<div class="results-count">${items.length} ${items.length===1?'registro encontrado':'registros encontrados'}</div>`+(items.length?(m.id==='oficinas'&&state.view==='cards'?`<div class="cards">${items.map((r,i)=>card(r,i)).join('')}</div>`:`<div class="tablewrap"><table><thead><tr><th>${esc(cols[0].label)}</th><th>${esc(m.id==='oficinas'?'Data e horário':cols[1]?.label||'Informações')}</th>${mf?`<th>${esc(mf.label)}</th>`:''}<th>Estado</th><th>Atualização</th><th><span class="muted">Ações</span></th></tr></thead><tbody>${items.map(r=>`<tr class="${m.id==='oficinas'&&isRealized(r)?'past':''}"><td><span class="truncate">${esc(r.dados[cols[0].key])}</span></td><td><span class="truncate muted">${m.id==='oficinas'?esc(fmtDate(r.dados.data)):esc(Array.isArray(r.dados[cols[1]?.key])?r.dados[cols[1].key].join(', '):(r.dados[cols[1]?.key]??'–'))}</span></td>${mf?`<td><div class="chips">${(r.dados[mf.key]||[]).map(id=>refChip('oficinas',id)).join('')||'<span class="muted">Nenhuma</span>'}</div></td>`:''}<td>${m.id==='oficinas'?statusPills(r)||badge(r):badge(r)}</td><td class="muted">${date(r.atualizadoEm)}</td><td><div class="rowactions"><button class="iconbutton" title="Consultar" aria-label="Consultar ${esc(label(r))}" data-action="${m.id==='oficinas'?'openoficina':'detail'}" data-module="${m.id}" data-id="${r.id}">${icon('eye')}</button>${canWrite(m)&&C.canEdit(m,r)?`<button class="iconbutton" title="Editar" aria-label="Editar ${esc(label(r))}" data-action="edit" data-module="${m.id}" data-id="${r.id}">${icon('edit')}</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`):`<div class="empty">${icon('search')}<h2>${filtered?'Nenhum resultado por aqui':'Seu primeiro cadastro começa aqui'}</h2><p>${filtered?'Tente outro termo ou altere os filtros.':'Adicione uma ficha para começar a organizar as informações.'}</p>${filtered||can?`<button class="button" data-action="${filtered?'clear':'create'}" data-module="${m.id}">${filtered?'Limpar filtro function detail(m,r){drawerRecord=structuredClone(r);const dialog=$('#drawer');const can=canWrite(m);dialog.innerHTML=`<div class="drawerhead"><div><span class="eyebrow muted">${esc(m.title)}</span><h2 id="drawer-title">${esc(label(r))}</h2><p>Informações do cadastro</p></div><button class="iconbutton" data-action="close" aria-label="Fechar detalhes">${icon('close')}</button></div><div class="drawerbody"><div class="detailmeta">${badge(r)}<span class="badge">Atualizado em ${date(r.atualizadoEm)}</span></div>${r.estado==='ARQUIVADO'?`<div class="alertline">${m.policy==='operacao'?'O registro está arquivado e continua disponível para edição.':'O registro está preservado. Restaure para voltar a editar.'}</div>`:''}<dl>${(linkField(m)?[linkField(m),...m.fields.filter(f=>f!==linkField(m))]:m.fields).map(f=>`<div class="detailitem"><dt>${esc(f.label)}</dt><dd>${valueHTML(f,r.dados[f.key])}</dd></div>`).join('')}</dl>${relatedHTML(m,r)}</div><div class="drawerfoot">${can&&m.id==='interesses'&&r.estado==='ATIVO'&&r.dados.situacao==='Pendente'?`<button class="outline" data-action="recusar" data-module="interesses" data-id="${r.id}">${icon('x')}Recusar</button><button class="button" data-action="aceitar" data-module="interesses" data-id="${r.id}">${icon('check')}Aceitar</button>`:''}${can&&m.policy==='conteudo'&&r.estado!=='ARQUIVADO'?`<button class="outline" data-action="${r.estado==='OCULTO'?'publicar':'ocultar'}" data-module="${m.id}" data-id="${r.id}">${r.estado==='OCULTO'?'Publicar':'Ocultar'}</button>`:''}${can&&m.archive!==false?`<button class="outline" data-action="${r.estado==='ARQUIVADO'?'restaurar':'arquivar'}" data-module="${m.id}" data-id="${r.id}">${icon(r.estado==='ARQUIVADO'?'restore':'archive')}${r.estado==='ARQUIVADO'?'Restaurar':'Arquivar'}</button>${C.canEdit(m,r)?`<button class="button" data-action="edit" data-module="${m.id}" data-id="${r.id}">${icon('edit')}Editar</button>`:''}`:''}${m.create===false&&m.id!=='interesses'?'<span class="badge">Enviado pelo portal · somente consulta</span>':''}</div>`;if(!dialog.open)dialog.showModal();}
function refList(target){return target==='oficinas'&&!(records.oficinas||[]).length?(publicData.oficinas||[]):(records[target]||[]);}
const refLabel=o=>`${label(o)}${o.modulo==='oficinas'&&o.dados.data?' · '+fmtDate(o.dados.data):o.modulo==='espacos'&&o.dados.capacidade?' · capacidade '+o.dados.capacidade:''}`;
function refOptions(f,value){const usable=refList(f.ref).filter(o=>o.estado==='ATIVO'||o.id===value);return `<option value="">${f.required?'Selecione':'Nenhum'}</option>${usable.map(o=>`<option value="${esc(o.id)}" ${o.id===value?'selected':''}>${esc(refLabel(o))}${o.estado==='ARQUIVADO'?' (arquivado)':''}</option>`).join('')}`;}
function refChecks(f,values){const chosen=[].concat(values||[]);const usable=refList(f.ref).filter(o=>o.estado==='ATIVO'||chosen.includes(o.id));return usable.length?`<div class="checks" id="f-${f.key}" role="group" aria-label="${esc(f.label)}">${usable.map(o=>`<label class="check"><input type="checkbox" name="${f.key}" value="${esc(o.id)}" ${chosen.includes(o.id)?'checked':''}><span>${esc(refLabel(o))}${o.estado==='ARQUIVADO'?' (arquivado)':''}</span></label>`).join('')}</div>`:'<div class="lockedfield">Nenhum registro ativo no cadastro.</div>';}
function fieldHTML(f,value,locked){let attrs=`id="f-${f.key}" name="${f.key}" ${f.required?'required':''} aria-describedby="hint-${f.key}"`;let control;
 if(locked)control=`<input type="hidden" name="${f.key}" value="${esc(value)}"><div class="lockedfield">${f.kind==='ref'?icon(icons[f.ref])+esc(refTitle(f.ref,value)):esc(value)}</div>`;
 else if(f.kind==='textarea')control=`<textarea ${attrs} ${f.max?'maxlength="'+f.max+'"':''}>${esc(value)}</textarea>`;
 else if(f.kind==='select')control=`<select ${attrs}><option value="">Selecione uma opção</option>${f.options.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
 else if(f.kind==='ref'&&f.multiple)control=refChecks(f,value);
 else if(f.kind==='ref')control=`<select ${attrs}>${refOptions(f,value)}</select>`;
 else if(f.kind==='datetime')control=`<input ${attrs} type="datetime-local" value="${esc(value)}">`;
 else if(f.kind==='list')control=`<div id="componentes">${(Array.isArray(value)&&value.length?value:['']).map((v,i)=>componentHTML(v,i,f.max)).join('')}</div><button type="button" class="outline" data-action="addcomponent">${icon('plus')}Adicionar componente</button>`;
 else control=`<input ${attrs} type="${['number','email','url','tel'].includes(f.kind)?f.kind:'text'}" value="${esc(value)}" ${f.kind==='number'?`min="${f.min}" max="${f.max}" step="1"`:f.max?`maxlength="${f.max}"`:''} ${f.kind==='tel'?'inputmode="tel" autocomplete="tel"':f.kind==='email'?'autocomplete="email"':''}>`;
 let hint=locked?'':f.hint||(f.kind==='select'||f.kind==='ref'?'Escolha uma das opções.':f.kind==='number'?`Número inteiro de ${f.min} a ${f.max}.`:f.max?`${f.required||f.min>0?f.min+' a ':''}${f.max} caracteres.`:'');
 return `<div class="field"><label ${f.kind!=='list'&&!(f.kind==='ref'&&f.multiple)&&!locked?`for="f-${f.key}"`:''}>${esc(f.label)}${!f.required?'<em>opcional</em>':''}</label>${control}<small id="hint-${f.key}">${esc(hint)}</small></div>`;
}
function componentHTML(v,i,max=100){return `<div class="component-row"><input name="componente" aria-label="Componente ${i+1}" maxlength="${max}" required value="${esc(v)}"><button type="button" class="iconbutton" data-action="removecomponent" aria-label="Remover componente ${i+1}">${icon('close')}</button></div>`;}
const formNote=m=>m.id==='oficinas'?'O espaço é dispensado em oficinas online. O limite não pode passar da capacidade do espaço, e o sistema recusa conflitos de espaço, instrutor ou equipamento no mesmo horário.':m.id==='espacos'?'A capacidade limita as oficinas presenciais e híbridas que usam o espaço.':m.id==='equipamentos'?'Um equipamento não pode ser reservado para duas oficinas no mesmo horário.':m.id==='participantes'?'A oficina precisa ter vaga. Arquivar um participante libera a vaga.':m.id==='avaliacoes'?'A avaliação só é aceita depois que a oficina acontece.':m.policy==='conteudo'?'O conteúdo começa oculto e pode ser publicado após a revisão.':linkField(m)?'Somente oficinas ativas podem receber novas fichas.':'Os dados informados pertencem apenas a esta ficha.';
function edit(m,r=null,preset={},lock=''){drawerRecord=r?structuredClone(r):null;const dialog=$('#drawer');const fields=formFields(m);const lockKey=lock||(r&&state.route==='oficina'&&linkField(m)?.key)||'';const missing=m.fields.filter(f=>f.kind==='ref'&&f.required&&f.key!==lockKey&&!(records[f.ref]||[]).some(o=>o.estado==='ATIVO')).map(f=>mod(f.ref)?.title||f.label);dialog.innerHTML=`<div class="drawerhead"><div><span class="eyebrow muted">${esc(m.title)}</span><h2 id="drawer-title">${r?'Editar':'Cadastrar'} ${esc(m.singular)}</h2><p>${r?'Atualize as informações e salve suas alterações.':'Preencha as informações para criar uma nova ficha.'}</p></div><button class="iconbutton" data-action="close" aria-label="Fechar formulário">${icon('close')}</button></div><div class="drawerbody"><form id="record-form" data-module="${m.id}" novalidate><div id="form-error" role="alert">${missing.length&&!r?`<div class="form-error">Cadastre ou restaure antes: ${esc(missing.join(', '))}. Esta ficha depende de um registro ativo.</div>`:''}</div>${fields.map(f=>fieldHTML(f,r?.dados[f.key]??preset[f.key]??'',f.key===lockKey)).join('')}<p class="smallnote">${formNote(m)}</p></form></div><div class="drawerfoot"><button class="outline" data-action="close">Cancelar</button><button class="button" type="submit" form="record-form">${icon('check')}Salvar cadastro</button></div>`;if(!dialog.open)dialog.showModal();}

function renderPortal(){
 const {oficinas,conteudo,faq}=communityView(),community=state.profile==='comunidade',tabs=portalTabs();
 if(!tabs.some(t=>t[0]===state.portalTab))state.portalTab='oficinas';
 const can=id=>!!mod(id)?.community,of=(r,id)=>r.modulo===id,prep=o=>conteudo.filter(c=>['guias','materiais','leituras'].some(x=>of(c,x))&&c.dados.oficina===o.id);

 const course=(o,i)=>{const past=isRealized(o),full=!past&&isFull(o),items=prep(o).sort((a,b)=>(a.modulo==='leituras'&&b.modulo==='leituras')?a.dados.ordem-b.dados.ordem:0);

 return ['Visão geral','Calendário',...sorted(modules.filter(m=>(m.menu||[]).includes('organizacao'))).map(m=>m.title),'Página da oficina com abas'];}
function renderDomain(){const full=modules.length===19;$('#conteudo').innerHTML=`<div class="pageheading"><div><div class="eyebrow muted" style="margin-bottom:10px">O projeto em 3 minutos</div><h1>Aprendizagem pede organização.</h1><p>Um lugar para planejar oficinas acadêmicas e reunir tudo o que cada uma precisa.</p></div></div>${presentationTabs()}<div class="focusnote"><strong>O problema:</strong> agenda, vagas, interessados, materiais e tarefas ficam espalhados em mensagens e planilhas, e é fácil marcar duas oficinas no mesmo espaço ou passar do limite da sala. O Oficina Campus organiza tudo em torno de cada oficina, com calendário sem conflitos, controle de vagas e histórico preservado.${full?'':' Este repositório ainda não reúne as cinco partes do grupo.'}</div><div class="personas">${[['organizacao','Administra a programação de oficinas da instituição.','Montar a agenda sem conflitos, decidir quem participa e manter as informações atualizadas.','Dados espalhados, conflitos de horário e local, e interessados sem resposta.'],['comunidade','Aluno que procura oficinas para aprender algo novo.','Encontrar oficinas com vaga, manifestar interesse, se preparar, avaliar depois e tirar dúvidas com a organização.','Não saber se ainda há vaga nem como se preparar.'],['apoio','Professora que ajuda a preparar e conduzir as oficinas.','Ver, por oficina, quem vai participar, os recursos reservados e o que falta fazer.','Checklists soltos e descobrir na hora que falta material ou equipamento.']].map(([p,context,goal,pain])=>{const x=PROFILES[p],screens=personaScreens(x.persona);return `<article class="persona"><div class="avatar">${x.initials}</div><h3>${x.persona}</h3><div class="role">${x.role} · perfil ${x.label}</div><p>${context}</p><h3>Objetivo</h3><p>${goal}</p><h3>Dificuldade</h3><p>${pain}</p>${screens.length?`<h3>Telas</h3><p>${screens.map(esc).join(' · ')}</p>`:''}</article>`;}).join('')}</div><p class="smallnote">Personas hipotéticas elaboradas para orientar este protótipo. Não representam entrevistas realizadas.</p><div class="twocol"><section class="panel"><h2>O que o sistema entrega</h2><p class="note">${modules.length} funcionalidades e um calendário. ${modules.filter(m=>m.tab).length?`${modules.filter(m=>m.tab).length} delas ficam dentro da página da oficina, nas abas Pessoas, Recursos, Preparação e Execução. `:''}Cada funcionalidade inclui cadastro, consulta, edição e arquivamento reversível.</p><div class="legend"><span>Calendário sem conflitos</span><span>Vagas por oficina</span><span>Interesse aceito vira participante</span><span>Telas por perfil</span></div></section><section class="panel"><h2>Limite do domínio</h2><p class="note">Não há login, pagamento nem envio real de e-mails: o seletor de perfil organiza as telas de cada persona, e a mensagem ao aluno apenas avisa que o contato será por e-mail. Lucas não se inscreve sozinho: ele manifesta interesse e a organização aceita ou recusa. A apresentação começa pelos cadastros independentes (instrutores e espaços) e segue para o que depende da oficina.</p></section></div>${footer()}`;}
function renderMap(){let activities=['Preparar a base','Ouvir a comunidade','Organizar a realização','Orientar a comunidade','Aprender e manter'].filter(a=>modules.some(m=>m.activity===a));const usId=m=>`US-${m.owner}${String(modules.filter(x=>x.owner===m.owner).indexOf(m)+1).padStart(2,'0')}`;$('#conteudo').innerHTML=`<div class="pageheading"><div><div class="eyebrow muted" style="margin-bottom:10px">Jornada da organização</div><h1>Mapa de histórias do usuário</h1><p>Da base de cadastros à manutenção das informações.</p></div><button class="outline" data-action="print">${icon('download')}Imprimir / PDF</button></div>${presentationTabs()}<div class="focusnote">Leia as atividades da esquerda para a direita. As faixas mostram três incrementos de valor. Cada cartão indica a persona e de que outras funcionalidades ele depende; os cartões tracejados são histórias de Lucas no portal.</div><div class="map-scroll"><div class="storymap" style="grid-template-columns:repeat(${activities.length},minmax(180px,1fr))">${activities.map((a,i)=>`<div class="maphead"><small>ATIVIDADE ${String(i+1).padStart(2,'0')}</small><h3>${a}</h3></div>`).join('')}${['01 · Primeiro uso, registrar e encontrar','02 · Manutenção, corrigir e disponibilizar','03 · Preservação, arquivar e recuperar'].map((lane,l)=>`<div class="maplane">${lane}</div>${activities.map(a=>`<div class="storycolumn">${sorted(modules.filter(m=>m.activity===a)).map(m=>`<button class="storycard" data-action="goto" data-module="${m.id}"><b>${(()=>{const so=m.create===false&&m.id!=='interesses';return l===0?(m.id==='interesses'?'Aceitar e recusar':so?'Consultar envios':'Cadastrar e consultar'):l===1?(m.policy==='conteudo'?'Editar e publicar':m.id==='interesses'?'Acompanhar a situação':so?'Pesquisar e filtrar':'Editar informações'):(so?'Consultar o histórico':'Arquivar e restaurar');})()} · ${esc(m.title)}</b><p>${(()=>{const so=m.create===false&&m.id!=='interesses';return l===0?esc(m.story):l===1?(m.policy==='conteudo'?'Como organizadora, quero escolher quando exibir o conteúdo para compartilhá-lo após minha revisão.':m.id==='interesses'?'Como organizadora, quero ver quais interesses estão pendentes, aceitos ou recusados.':so?'Como organizadora, quero pesquisar os envios da comunidade para encontrar rapidamente o que procuro.':'Como responsável, quero corrigir a ficha para manter as informações úteis e atualizadas.'):(so?'Como organizadora, quero consultar todos os envios recebidos, sem alterar o que a comunidade escreveu.':m.policy==='operacao'?'Como organizadora, quero preservar registros fora da listagem ativa, mantendo a possibilidade de edição.':'Como responsável, quero retirar registros da listagem ativa e recuperá-los preservando o histórico.');})()}</p><small>${usId(m)}-${l+1} · ${esc(m.persona||'Marina')}${(()=>{const deps=[...new Set(m.fields.filter(f=>f.kind==='ref').map(f=>mod(f.ref)?.title).filter(Boolean))];return deps.length?' · depende de '+deps.join(' e '):'';})()}</small></button>`).join('')}${l===0?sorted(modules.filter(m=>m.activity===a&&m.community)).map(m=>`<a class="storycard community" href="#portal"><b>Pelo portal · ${esc(m.title)}</b><p>${esc(m.communityStory)}</p><small>${usId(m)}-P · Lucas</small></a>`).join(''):''}${a==='Preparar a base'&&l===0&&mod('oficinas')?'<a class="storycard" href="#calendario"><b>Calendário · Oficinas</b><p>Como organizadora, quero ver as oficinas em um calendário interativo, com instrutores e locais, para evitar conflitos de data e horário.</p><small>US-1-C · Marina · depende de Oficinas</small></a>':''}</div>`).join('')}`).join('')}</div></div><div class="legend"><span>Todos os incrementos estão incluídos nesta versão</span><span>${modules.length} funcionalidades e o calendário · ${modules.length*3} histórias de manutenção · ${modules.filter(m=>m.community).length} histórias do portal</span></div>${footer()}`;}
function renderScript(){const full=modules.length===19;const stages=full?[
['00:00–02:30','Contexto, personas e mapa','Apresente o problema e as três personas: Marina (administradora), Beatriz (professora) e Lucas (aluno). Troque de perfil no topo para mostrar que cada uma vê telas diferentes.','dominio'],

['06:30–09:30','Luca · Recursos','Equipamentos e instituições parceiras são cadastros gerais. Na aba Recursos de uma oficina, reserve um equipamento e mostre a recusa quando ele já está em outra oficina no mesmo horário. Mostre o kit de materiais e a acessibilidade.','equipamentos'],
['09:30–13:00','Ricardo · Relacionamento','Como Lucas, clique em “Tenho interesse”, preencha nome, e-mail, telefone e profissão e mostre a mensagem do e-mail. Como Beatriz, aceite o interesse na aba Pessoas: ele vira participante e as vagas diminuem. Mostre “Vagas esgotadas” no portal e a avaliação liberada só para a oficina realizada. Como Lucas, envie uma dúvida em “Falar com a organização”; volte como Beatriz e consulte em Atendimentos.','oficinas'],
['13:00–16:30','Victor · Conteúdo','Na aba Preparação, cadastre um material (link), um guia e uma leitura complementar (livro, autor, trecho). Publique e abra como Lucas: tudo aparece no cartão da oficina. Mostre a aba Comunicados do portal.','comunicados'],
['16:30–19:30','João Cláudio · Operação','Na aba Execução, uma tarefa e uma ocorrência com situação. Volte à tela inicial da Beatriz e mostre o checklist de cada oficina. Como Lucas, sugira uma oficina e abra a aba Perguntas frequentes; mostre que Marina e Beatriz apenas consultam as sugestões.','sugestoes'],
['19:30–20:00','Encerramento','Retome o problema resolvido, os três perfis e os limites do recorte. Deixe o calendário aberto.','calendario']
]:[['00:00–02:30','Contexto e personas','Apresente o domínio, as personas hipotéticas e o mapa deste recorte.','dominio'],['02:30–06:00','Funcionalidades deste recorte','Demonstre cadastro, validação, edição, arquivamento e restauração. Mostre o calendário e a oficina no portal.','oficinas'],['06:00–20:00','Integração das demais partes','A apresentação coletiva precisa das partes dos demais integrantes.','inicio']];$('#conteudo').innerHTML=`<div class="pageheading"><div><div class="eyebrow muted" style="margin-bottom:10px">Apresentação · Requisitos</div><h1>Um roteiro de 20 minutos.</h1><p>Comece pelos cadastros independentes, siga para a oficina e termine no que depende dela.</p></div></div>${presentationTabs()}<div class="timeline">${stages.map(([t,title,desc,id])=>`<article class="timeline-row"><time>${t}</time><div><h3>${title}</h3><p>${desc}</p><a class="textlink" href="#${id}">Abrir demonstração →</a></div></article>`).join('')}</div><div class="focusnote" style="margin-top:22px">Ensaiem com um cronômetro e clique em “Restaurar demonstração” antes de começar. Instrutores e espaços são independentes; a oficina depende deles; equipamentos e parceiras são gerais e se ligam a várias oficinas; pessoas, kits, acessibilidade, preparação e execução pertencem a uma oficina.</div>${footer()}`;}

/* ---------- Ações ---------- */
async function setProfile(p){if(!availableProfiles().includes(p))return;state.profile=p;state.month='';try{localStorage.setItem(profileKey,p);}catch{}const target=p==='comunidade'?'portal':'inicio';if(live)await refresh();if(location.hash.slice(1)!==target)location.hash=target;else route();}
const ACTION_TEXT={arquivar:['Arquivar este registro?','Os dados serão preservados e o registro sairá da listagem ativa.'],restaurar:['Restaurar este registro?','O registro voltará à listagem ativa, preservando seus dados.'],publicar:['Publicar no portal?','Este conteúdo ficará disponível na consulta do portal da comunidade.'],ocultar:['Ocultar do portal?','O conteúdo ficará acessível apenas na área de organização.'],aceitar:['Aceitar este interesse?','A pessoa será incluída como participante da oficina e ocupará uma vaga.'],recusar:['Recusar este interesse?','A manifestação ficará registrada como recusada. Nenhum participante será incluído.']};
async function runAction(button){const a=button.dataset.action,m=mod(button.dataset.module||state.route);let r=m&&(records[m.id]||[]).find(x=>x.id===button.dataset.id);
 if(a==='menu'){$('.sidebar').classList.toggle('open');return;}
 if(a==='close'){$('#drawer').close();return;}
 if(a==='profile'){$('#drawer').close();await setProfile(button.dataset.profile);return;}
 if(a==='portaltab'){state.portalTab=button.dataset.tab;if(state.profile==='comunidade')shellCommunity();else renderPortal();window.scrollTo(0,0);return;}
 if(a==='tab'){state.tab=button.dataset.tab;history.replaceState(null,'',`#oficina/${state.oficinaId}/${state.tab}`);renderOficina();return;}
 if(a==='openoficina'){$('#drawer').close();const t=button.dataset.tab||'resumo';const target=`oficina/${button.dataset.id}${t!=='resumo'?'/'+t:''}`;if(location.hash.slice(1)===target)route();else location.hash=target;return;}
 if(a==='month'){const d=Number(button.dataset.delta);state.month=d===0?agora().slice(0,7):shiftMonth(state.month||defaultMonth(),d);renderPage();return;}
 if(a==='createday'){edit(mod('oficinas'),null,{data:button.dataset.day+'T09:00'});return;}
 if(a==='goto'){location.hash=m.tab?'oficinas':m.id;return;}
 if(a==='print'){window.print();return;}
 if(a==='clear'){state.query='';state.filter='TODOS';renderModule();return;}
 if(a==='view'){state.view=button.dataset.view;renderModule();return;}
 if(a==='create'){edit(m);return;}
 if(a==='createin'){edit(m,null,{[linkField(m).key]:button.dataset.oficina},linkField(m).key);return;}
 if(a==='reserve'){reserveForm(m,button.dataset.oficina);return;}
 if(a==='unreserve'&&r){const mf=multiField(m);confirmAction(m.id==='equipamentos'?'Cancelar a reserva?':'Remover o apoio?',`${label(r)} deixará de estar ligado a esta oficina.`,async()=>{await save(m,{...r.dados,[mf.key]:(r.dados[mf.key]||[]).filter(x=>x!==button.dataset.oficina)},r);renderPage();notify('Alteração salva com sucesso.');});return;}
 if(a==='community'){communityForm(m,button.dataset.oficina);return;}
 if(a==='readguide'){readGuide(button.dataset.id);return;}
 if(a==='detail'&&r){detail(m,r);return;}
 if(a==='edit'&&r){if(!C.canEdit(m,r))C.fail('Restaure antes de editar.',409);edit(m,r);return;}
 if(a==='addcomponent'){const list=$('#componentes');list.insertAdjacentHTML('beforeend',componentHTML('',list.children.length));list.lastElementChild.querySelector('input').focus();return;}
 if(a==='removecomponent'){button.closest('.component-row').remove();return;}
 if(['aceitar','recusar'].includes(a)&&r){const [t,msg]=ACTION_TEXT[a];confirmAction(t,msg,async()=>{await decide(r,a);$('#drawer').close();renderPage();notify(a==='aceitar'?'Interesse aceito: a pessoa agora é participante.':'Interesse recusado.');});return;}
 if(['arquivar','restaurar','publicar','ocultar'].includes(a)&&r){const snapshot=$('#drawer').open&&drawerRecord&&drawerRecord.id===r.id?drawerRecord:r;let [t,msg]=ACTION_TEXT[a];if(m.id==='oficinas'&&a==='arquivar')msg='A oficina sairá do portal, do calendário e da listagem ativa. As fichas ligadas a ela continuam preservadas.';if(m.policy==='conteudo'&&a==='restaurar')msg='O conteúdo voltará como oculto. A publicação deverá ser feita manualmente.';confirmAction(t,msg,async()=>{await change(m,snapshot,a);$('#drawer').close();renderPage();notify('Alteração salva com sucesso.');});return;}
 if(a==='reset'){confirmAction('Restaurar a demonstração?','Os dados de demonstração salvos neste navegador serão substituídos pelos exemplos iniciais.',async()=>{localStorage.removeItem(key);await refresh();renderPage();notify('Demonstração restaurada.');});return;}
 if(a==='seed'){confirmAction('Carregar exemplos fictícios?','Serão adicionados exemplos às telas que ainda estiverem vazias. Os cadastros existentes serão preservados.',async()=>{const made={};let skipped=0;
  // Cria o exemplo pedido e, antes dele, os registros que ele referencia ("@modulo:N").
  const make=async(id,n)=>{const k=id+':'+n;if(made[k])return made[k];const existing=(records[id]||[]).filter(r=>r.estado==='ATIVO');const spec=mod(id);if(!spec)return '';if(existing.length&&!made['novo:'+id])return made[k]=existing[n%existing.length].id;const data={};for(const [f,v] of Object.entries(spec.seeds[n%spec.seeds.length])){if(Array.isArray(v)){data[f]=[];for(const x of v)data[f].push(seedRef(x)?await make(seedRef(x).mod,seedRef(x).n):x);}else data[f]=seedRef(v)?await make(seedRef(v).mod,seedRef(v).n):v;}const saved=await api((spec.create===false?'/public/':'/registros/')+id,'POST',{dados:data});return made[k]=saved.id;};
  for(const spec of sorted(modules)){if((records[spec.id]||[]).length)continue;made['novo:'+spec.id]=true;for(let n=0;n<spec.seeds.length;n++){try{await make(spec.id,n);}catch{skipped++;}}}
  await refresh();renderPage();notify(skipped?`Exemplos carregados. ${skipped} não puderam ser criados por regras de agenda ou vagas.`:'Exemplos fictícios carregados.');});}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled)runAction(b).catch(err=>notify(err.message));});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.query=e.target.value;renderRecords();}});
document.addEventListener('change',e=>{if(e.target.id==='filter'){state.filter=e.target.value;renderRecords();}if(e.target.id==='sort'){state.sort=e.target.value;renderRecords();}});
document.addEventListener('submit',async e=>{
 if(e.target.id==='reserve-form'){e.preventDefault();if(busy)return;const form=e.target,m=mod(form.dataset.module),mf=multiField(m),id=form.elements.namedItem('escolha')?.value;const r=(records[m.id]||[]).find(x=>x.id===id);if(!r){$('#form-error').innerHTML='<div class="form-error">Escolha uma opção.</div>';return;}busy=true;try{await save(m,{...r.dados,[mf.key]:[...(r.dados[mf.key]||[]),form.dataset.oficina]},r);$('#drawer').close();renderPage();notify(m.id==='equipamentos'?'Equipamento reservado.':'Instituição parceira adicionada.');}catch(error){$('#form-error').innerHTML=`<div class="form-error">${esc(error.message)}</div>`;}finally{busy=false;}return;}
 if(e.target.id!=='record-form')return;e.preventDefault();if(busy)return;const form=e.target,m=mod(form.dataset.module),community=form.dataset.community==='1',data={};
 for(const f of m.fields){if(f.readonly)data[f.key]=drawerRecord?.dados[f.key]??'';else if(f.kind==='list')data[f.key]=[...form.querySelectorAll('[name="componente"]')].map(el=>el.value);else if(f.kind==='ref'&&f.multiple)data[f.key]=[...form.querySelectorAll(`[name="${f.key}"]:checked`)].map(el=>el.value);else{let val=form.elements.namedItem(f.key)?.value??'';data[f.key]=f.kind==='number'?(val===''?null:Number(val)):val;}}
 busy=true;const submit=$('[form="record-form"]');submit.disabled=true;
 try{if(community){await sendCommunity(m,data);if(m.id==='interesses'){renderPage();interestSent(data);}else{$('#drawer').close();renderPage();notify({sugestoes:'Obrigado! Sua sugestão chegou à organização.',avaliacoes:'Obrigado! Sua avaliação foi registrada.',atendimentos:'Mensagem enviada! A organização recebeu sua dúvida.'}[m.id]||'Envio registrado.');}}else{await save(m,data,drawerRecord);$('#drawer').close();renderPage();notify('Cadastro salvo com sucesso.');}}
 catch(error){$('#form-error').innerHTML=`<div class="form-error">${esc(error.message)}</div>`;$('#form-error').scrollIntoView({block:'center',behavior:'smooth'});}
 finally{busy=false;if(submit.isConnected)submit.disabled=false;}
});
function route(){
 if(!availableProfiles().includes(state.profile))state.profile='organizacao';
 const parts=(location.hash.slice(1)||'inicio').split('/');state.route=parts[0];state.query='';state.filter='TODOS';
 if(state.route==='oficina'){state.oficinaId=parts[1]||'';state.tab=parts[2]||'resumo';}
 const org=state.profile==='organizacao',hasOficinas=!!mod('oficinas');
 const allowed=state.profile==='comunidade'?['portal']:['inicio',...menuModules().map(m=>m.id),...(hasOficinas?['calendario','oficina','oficinas']:[]),...(org?['mapa','dominio','roteiro','portal']:[])];
 if(!allowed.includes(state.route))state.route=state.profile==='comunidade'?'portal':'inicio';
 $('#drawer').close();shell();window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);window.addEventListener('storage',async e=>{if(!live&&e.key===key){await refresh();renderPage();}});
$('#app').innerHTML='<main class="content"><h1>Oficina Campus</h1><p>Preparando seu espaço…</p></main>';
if(location.protocol!=='file:'){try{let response=await fetch('/api/meta',{signal:AbortSignal.timeout(4000)});if(response.ok){let meta=await response.json();if(Array.isArray(meta.modulos)){modules=meta.modulos;serverNow=meta.agora||'';live=true;}}}catch{}}
try{await refresh();route();}catch(e){$('#app').innerHTML=`<main class="content"><h1>Não foi possível carregar os cadastros.</h1><p>${esc(e.message)}</p><button class="button" onclick="location.reload()">Tentar novamente</button></main>`;}
})();
</script>
</body></html>
